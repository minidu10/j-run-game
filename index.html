<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J-Run — Forest Chase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="game" width="960" height="540" aria-label="Forest runner game"></canvas>

      <div class="hud" id="hud">
        <div class="hud-row">
          <span class="hud-label">SCORE</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">BEST</span>
          <span class="hud-value" id="best">0</span>
        </div>
        <div class="hud-row hearts" id="hearts" aria-label="Lives"></div>
      </div>

      <div class="overlay" id="overlay">
        <h1 class="title">J-Run</h1>
        <p class="subtitle">A man, a forest, and a very hungry tiger.</p>
        <ul class="keys">
          <li><kbd>Space</kbd> / <kbd>↑</kbd> Jump</li>
          <li><kbd>↓</kbd> Slide</li>
          <li><kbd>Shift</kbd> Dash</li>
        </ul>
        <button id="play" class="play">Start running</button>
      </div>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
